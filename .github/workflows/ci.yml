name: tests

# v0.2.0 出貨後才發現 3.10/3.11 連 import 都失敗（巢狀引號 f-string 需要 PEP 701），
# 而本機只跑 3.12 所以全綠。這個 matrix 的存在就是為了讓那類錯誤不再靠人工發現。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows 納入 matrix 不是為了「支援更多平台」這種漂亮話：README 掛著 Windows
    # badge，卻從來沒在 Windows 上跑過。要嘛驗證它，要嘛把 badge 拿掉。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Windows 只跑頭尾兩版即可涵蓋語法與行為差異，中間版本由 Linux 覆蓋
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install -r requirements.txt pytest
      - name: import check (catches syntax not covered by tests)
        run: python -m compileall -q scripts
      - name: pytest
        run: python -m pytest tests -q
